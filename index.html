<div class="wrap">

<script>
/* ============================================================
   গিট গেম বাংলা — মিনি গিট সিমুলেটর + ১০ লেভেল
   ============================================================ */

/* ---------- গিট সিমুলেটর ---------- */
function makeState(level) {
  return {
    repo: false, head: null, branches: {}, commits: [],
    files: level.files.map(f => ({ name: f.n, st: f.st || 'untracked' })),
    sawStatus: false, sawLog: false, merged: false, pushed: false,
  };
}

function tokenize(cmd) {
  const toks = []; const re = /"([^"]*)"|'([^']*)'|(\S+)/g; let m;
  while ((m = re.exec(cmd))) toks.push(m[1] !== undefined ? m[1] : m[2] !== undefined ? m[2] : m[3]);
  return toks;
}

/* প্রতিটা কমান্ড আউটপুট লাইন দেয়: {lines:[{t, c}], } */
function runGit(s, cmdRaw) {
  const out = [];
  const push = (t, c) => out.push({ t, c: c || 'out' });
  const cmd = cmdRaw.trim();
  if (!cmd) return { lines: out };
  if (cmd === 'help') {
    push('সাপোর্টেড কমান্ড:', 'ok');
    push('git init · git add <file|.> · git commit -m "মেসেজ" · git status');
    push('git log [--oneline] · git branch [name] · git switch <name>');
    push('git checkout <name> · git merge <name> · git push · clear');
    return { lines: out };
  }
  if (cmd === 'clear') return { clear: true, lines: out };
  const toks = tokenize(cmd);
  if (toks[0] !== 'git') { push('এটা গিট কমান্ড না। সাহায্যের জন্য "help" লিখুন।', 'err'); return { lines: out }; }
  const sub = toks[1];

  if (!s.repo && sub !== 'init') {
    push('প্রথমে রিপোজিটরি তৈরি করতে হবে — "git init" চালান!', 'err');
    return { lines: out };
  }

  switch (sub) {
    case 'init':
      if (s.repo) push('আগেই ইনিট করা হয়েছে।', 'err');
      else {
        s.repo = true; s.head = 'main'; s.branches = { main: [] };
        push('Initialized empty Git repository in ~/game/.git/');
        push('✨ খালি রিপোজিটরি তৈরি হলো — ব্রাঞ্চ: main', 'ok');
      }
      break;

    case 'add': {
      const target = toks[2];
      if (!target) { push('কোন ফাইল স্টেজ করবেন? যেমন: git add index.html বা git add .', 'err'); break; }
      let changed = 0;
      for (const f of s.files) {
        const match = target === '.' || f.name === target || f.name.startsWith(target);
        if (match && (f.st === 'untracked' || f.st === 'modified')) { f.st = 'staged'; changed++; }
      }
      if (changed) push(changed + 'টা ফাইল স্টেজ করা হলো ✅');
      else push('স্টেজ করার মতো নতুন/পরিবর্তিত কিছু নেই।', 'err');
      break;
    }

    case 'commit': {
      let msg = null;
      const mi = toks.indexOf('-m');
      if (mi >= 0 && toks[mi + 1]) msg = toks[mi + 1];
      const staged = s.files.filter(f => f.st === 'staged');
      if (!msg) { push('কমিট মেসেজ দিতে ভুলেছেন! যেমন: git commit -m "প্রথম কমিট"', 'err'); break; }
      if (!staged.length) { push('কিছু স্টেজ করা নেই — আগে "git add" করুন।', 'err'); break; }
      const id = (s.commits.length + 1).toString(16).padStart(7, '0') + Math.floor(Math.random() * 99);
      const commit = { id, msg, branch: s.head, files: staged.map(f => f.name) };
      s.commits.push(commit);
      s.branches[s.head].push(commit);
      staged.forEach(f => f.st = 'committed');
      push('[' + s.head + ' ' + id.slice(0, 7) + '] ' + msg);
      push(staged.length + 'টা ফাইল কমিট হলো ✅');
      break;
    }

    case 'status': {
      s.sawStatus = true;
      push('On branch ' + s.head);
      const un = s.files.filter(f => f.st === 'untracked');
      const mo = s.files.filter(f => f.st === 'modified');
      const st = s.files.filter(f => f.st === 'staged');
      if (un.length) { push('Untracked ফাইল:'); un.forEach(f => push('\t' + f.name, 'err')); }
      if (mo.length) { push('পরিবর্তিত ফাইল:'); mo.forEach(f => push('\t' + f.name, 'err')); }
      if (st.length) { push('স্টেজড ফাইল:'); st.forEach(f => push('\t' + f.name, 'ok')); }
      if (!un.length && !mo.length && !st.length) push('nothing to commit, working tree clean ✨');
      break;
    }

    case 'log': {
      s.sawLog = true;
      const list = s.branches[s.head];
      if (!list.length) { push('এখনো কোনো কমিট নেই।', 'err'); break; }
      const oneline = toks.includes('--oneline');
      [...list].reverse().forEach(c => {
        if (oneline) push(c.id.slice(0, 7) + ' ' + c.msg);
        else { push('commit ' + c.id, 'ok'); push('    ' + c.msg); }
      });
      break;
    }

    case 'branch': {
      const name = toks[2];
      if (!name) {
        Object.keys(s.branches).forEach(b => push((b === s.head ? '* ' : '  ') + b, b === s.head ? 'ok' : 'out'));
      } else if (s.branches[name]) {
        push('"' + name + '" নামে ব্রাঞ্চ আগেই আছে।', 'err');
      } else {
        s.branches[name] = [...s.branches[s.head]];
        push('ব্রাঞ্চ "' + name + '" তৈরি হলো 🌿');
      }
      break;
    }

    case 'switch':
    case 'checkout': {
      const name = toks[2];
      if (!name) { push('কোন ব্রাঞ্চে যাবেন? যেমন: git switch feature', 'err'); break; }
      if (name === '-b') {
        const nb = toks[3];
        if (!nb) { push('-b এর পরে নতুন ব্রাঞ্চের নাম দিন।', 'err'); break; }
        s.branches[nb] = [...s.branches[s.head]];
        s.head = nb;
        push('নতুন ব্রাঞ্চ "' + nb + '" তৈরি করে সেটিতে চলে গেলাম ✅');
        break;
      }
      if (!s.branches[name]) { push('"' + name + '" নামে কোনো ব্রাঞ্চ নেই। "git branch" দিয়ে লিস্ট দেখুন।', 'err'); break; }
      s.head = name;
      push('Switched to branch "' + name + '" ✅');
      break;
    }

    case 'merge': {
      const name = toks[2];
      if (!name) { push('কোন ব্রাঞ্চ মার্জ করবেন? যেমন: git merge feature', 'err'); break; }
      if (!s.branches[name]) { push('"' + name + '" নামে কোনো ব্রাঞ্চ নেই।', 'err'); break; }
      if (name === s.head) { push('নিজেকে নিজের সাথে মার্জ করা যায় না 😅', 'err'); break; }
      const theirs = s.branches[name], ours = s.branches[s.head];
      const newOnes = theirs.filter(c => !ours.includes(c));
      if (!newOnes.length) { push('Already up to date — মার্জ করার কিছু নেই।'); break; }
      newOnes.forEach(c => ours.push(c));
      s.merged = true;
      s.files.forEach(f => { if (f.st !== 'committed') f.st = 'committed'; });
      push('Merge made by "ort" strategy.');
      push('"' + name + '" এর ' + newOnes.length + 'টা কমিট "' + s.head + '" এ মার্জ হলো ✅');
      break;
    }

    case 'push':
      if (!s.pushed) {
        s.pushed = true;
        push('Enumerating objects: done.');
        push('Writing objects: 100% (' + s.commits.length + '/' + s.commits.length + '), done.');
        push('To github.com:rasel/game.git');
        push('   main -> main 🚀 সফলভাবে পুশ হলো!', 'ok');
      } else push('সব আগেই পুশ করা আছে।', 'err');
      break;

    default:
      push('"' + sub + '" কমান্ডটা এখনো শেখানো হয়নি। "help" দেখুন।', 'err');
  }
  return { lines: out };
}

/* ---------- লেভেল ---------- */
const LEVELS = [
  {
    t: 'লেভেল ১ · রিপোজিটরি তৈরি',
    story: 'আপনি একটা নতুন ওয়েবসাইট প্রজেক্ট শুরু করেছেন। গিট দিয়ে ভার্সন কন্ট্রোল করতে হলে প্রথমে ফোল্ডারটাকে একটা রিপোজিটরি বানাতে হয়।',
    goal: '<b>লক্ষ্য:</b> <code>git init</code> চালিয়ে রিপোজিটরি তৈরি করুন',
    hint: 'টার্মিনালে লিখুন: <code>git init</code>',
    files: [{ n: 'index.html' }, { n: 'style.css' }],
    intro: ['👋 স্বাগতম! এখানে ২টা ফাইল আছে: index.html আর style.css', 'প্রতিটা লেভেলে লক্ষ্য পূরণ করলেই পরের লেভেল খুলবে। শুরু করুন!'],
    check: s => s.repo,
  },
  {
    t: 'লেভেল ২ · ফাইল স্টেজ করা',
    story: 'রিপো তৈরি! এখন ফাইলগুলো কমিটের জন্য "স্টেজিং এরিয়া"য় পাঠাতে হবে। গিট তিনটা জায়গা রাখে: ওয়ার্কিং ডিরেক্টরি → স্টেজ → কমিট হিস্ট্রি।',
    goal: '<b>লক্ষ্য:</b> সব ফাইল একসাথে স্টেজ করুন (<code>git add .</code>)',
    hint: 'একটা নির্দিষ্ট ফাইল: <code>git add index.html</code><br>সব একসাথে: <code>git add .</code>',
    files: [{ n: 'index.html' }, { n: 'style.css' }],
    autoRepo: true,
    intro: ['রিপোজিটরি রেডি। এবার ফাইলগুলো স্টেজ করুন।'],
    check: s => s.repo && s.files.every(f => f.st !== 'untracked'),
  },
  {
    t: 'লেভেল ৩ · প্রথম কমিট',
    story: 'স্টেজ করা ফাইলগুলো এখন কমিট করলে সেগুলো গিটের হিস্ট্রিতে চিরতরে সেভ হয়ে যাবে — যেমন সেভ পয়েন্ট!',
    goal: '<b>লক্ষ্য:</b> একটা মেসেজসহ কমিট করুন, যেমন <code>git commit -m "প্রথম কমিট"</code>',
    hint: 'মেসেজটা কোটেশনের ভেতরে: <code>git commit -m "প্রথম কমিট"</code>',
    files: [{ n: 'index.html' }, { n: 'style.css' }],
    autoRepo: true,
    intro: ['এবার অ্যাড + কমিট দুটোই আপনার হাতে!'],
    check: s => s.repo && s.commits.length >= 1,
  },

/* ---------- গেম স্টেট ---------- */
const $ = id => document.getElementById(id);
let cur = 0, S = null, won = false;
const STORE = 'git-game-bangla-v1';

function loadProgress() {
  try { return parseInt(localStorage.getItem(STORE) || '0', 10); } catch (e) { return 0; }
}
function saveProgress(n) {
  try { localStorage.setItem(STORE, String(n)); } catch (e) {}
}

function bn(x) { return String(x).replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[d]); }

function setupLevel(i) {
  cur = i;
  won = false;
  const L = LEVELS[i];
  S = makeState(L);
  // প্রি-কমিট/ব্রাঞ্চ সেটআপ
  if (L.preCommits || L.autoRepo) {
    S.repo = true; S.head = 'main'; S.branches.main = [];
    for (let k = 0; k < (L.preCommits || 0); k++) {
      const c = { id: 'a1b2c3d' + k, msg: k === 0 ? 'প্রথম কমিট' : 'আপডেট ' + bn(k), branch: 'main', files: [] };
      S.commits.push(c); S.branches.main.push(c);
    }
  }
  (L.branches || []).forEach(b => {
    S.branches[b] = [...S.branches.main];
    (L.featureCommits || 0) && b === 'feature' && (() => {
      const c = { id: 'f0f0f0f1', msg: 'ফিচার যোগ হলো', branch: 'feature', files: ['style.css'] };
      S.commits.push(c); S.branches.feature.push(c);
    })();
  });
  if (L.startBranch) S.head = L.startBranch;

  $('m-title').textContent = L.t + ' (' + bn(i + 1) + '/' + bn(LEVELS.length) + ')';
  $('m-story').innerHTML = L.story;
  $('m-goal').innerHTML = L.goal;
  $('m-hint').style.display = 'none';
  $('m-hint').innerHTML = '💡 ' + L.hint;
  $('winbox').classList.remove('show');
  $('tout').innerHTML = '';
  (L.intro || []).forEach(t => printLine(t, 'sys'));
  renderDots();
  $('tin').focus();
}

function renderDots() {
  const done = loadProgress();
  $('dots').innerHTML = LEVELS.map((L, i) => {
    let cls = 'dot';
    if (i < done) cls += ' done';
    if (i === cur) cls += ' cur';
    return '<div class="' + cls + '" onclick="gotoLevel(' + i + ')">' + bn(i + 1) + '</div>';
  }).join('');
}

function gotoLevel(i) {
  const done = loadProgress();
  if (i > done) { printLine('🔒 আগে লেভেল ' + bn(done + 1) + ' শেষ করুন!', 'err'); return; }
  setupLevel(i);
}

function printLine(t, c) {
  const div = document.createElement('div');
  div.className = 'l-' + (c || 'out');
  div.textContent = t;
  $('tout').appendChild(div);
  $('tout').scrollTop = $('tout').scrollHeight;
}

function handleCmd(raw) {
  if (won) return;
  printLine(raw, 'cmd');
  const res = runGit(S, raw);
  if (res.clear) { $('tout').innerHTML = ''; return; }
  res.lines.forEach(l => printLine(l.t, l.c));
  if (LEVELS[cur].check(S)) win();
}

function win() {
  won = true;
  const done = loadProgress();
  const isLast = cur === LEVELS.length - 1;
  if (!isLast) saveProgress(Math.max(done, cur + 1));
  else saveProgress(LEVELS.length);
  renderDots();
  printLine('', 'out');
  printLine('🎉 লেভেল ' + bn(cur + 1) + ' সম্পন্ন! ' + (isLast ? 'আপনি এখন গিটের বেসিক জানেন!' : ''), 'ok');
  $('winmsg').textContent = isLast ? '🏆 সব লেভেল শেষ! আপনি এখন গিটের বেসিক মাস্টার!' : '🎉 দারুণ! লেভেল ' + bn(cur + 1) + ' শেষ!';
  $('nextbtn').textContent = isLast ? '🔄 আবার খেলুন' : 'পরের লেভেল →';
  $('winbox').classList.add('show');
}

function nextLevel() {
  if (cur === LEVELS.length - 1) setupLevel(0);
  else setupLevel(cur + 1);
}
function resetLevel() { setupLevel(cur); }
function resetGame() { saveProgress(0); setupLevel(0); }
function showHint() { $('m-hint').style.display = 'block'; }

/* ---------- init ---------- */
$('tin').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const v = $('tin').value;
    $('tin').value = '';
    if (v.trim()) handleCmd(v.trim());
  }
});
setupLevel(Math.min(loadProgress(), LEVELS.length - 1));
</script>
